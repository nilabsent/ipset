name: Update IPset Lists

on:
  schedule:
    - cron: '58 9 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Run script
      run: |
        python asn2cidr.py download && python asn2cidr.py update
        rm -rf data

    - name: Smart Commit and Push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git add .

        if git diff --staged --quiet; then
            echo "No changes, exit"
            exit 0
        fi

        LAST_AUTHOR=$(git log -1 --pretty=format:'%an')

        if [ "$LAST_AUTHOR" = "github-actions[bot]" ]; then
            git commit --amend --no-edit
        else
            git commit -m "Auto-update IPset lists"
        fi

        git push --force
